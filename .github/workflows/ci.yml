name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ODIN_RELEASE: dev-2026-09

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-22.04 } # oldest glibc we support: 2.35
          - { name: linux-arm64, os: ubuntu-22.04-arm }
          - { name: windows-x64, os: windows-latest }
          - { name: macos-arm64, os: macos-latest }
    steps:
      - uses: actions/checkout@v4

      - uses: laytan/setup-odin@v2
        with:
          release: ${{ env.ODIN_RELEASE }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # clang links Odin programs, the -dev packages build raylib,
          # Mesa/Xvfb/fonts are for the screenshot test, shellcheck lints the scripts.
          sudo apt-get install -y --no-install-recommends clang make \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev \
            libgl1-mesa-dev libgl1-mesa-dri xvfb xauth fonts-dejavu-core shellcheck

      # Odin's prebuilt Linux raylib needs glibc 2.38+. Building it here keeps
      # our Linux binaries working on older distros (glibc 2.35+).
      - name: Build raylib
        if: runner.os == 'Linux'
        run: |
          git clone --depth 1 --branch 6.0 https://github.com/raysan5/raylib.git "$RUNNER_TEMP/raylib"
          make -C "$RUNNER_TEMP/raylib/src" -j"$(nproc)" PLATFORM=PLATFORM_DESKTOP RAYLIB_LIBTYPE=STATIC GLFW_LINUX_ENABLE_WAYLAND=FALSE
          case "$(uname -m)" in
            aarch64) dir=linux-arm64 ;;
            *)       dir=linux ;;
          esac
          cp "$RUNNER_TEMP/raylib/src/libraylib.a" "$(odin root)/vendor/raylib/$dir/libraylib.a"

      - name: Check
        run: odin check src -vet -strict-style

      - name: Lint shell scripts
        if: runner.os == 'Linux'
        run: shellcheck install.sh build.sh

      - name: Test
        run: odin test tests -vet -strict-style

      - name: Build
        if: runner.os != 'Windows'
        run: ./build.sh

      - name: Build
        if: runner.os == 'Windows'
        shell: cmd
        run: build.bat

      # Run the real app on the Odin install folder and save what it draws.
      - name: Screenshot
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1440x900x24" ./diskfull --screenshot "screenshot-${{ matrix.name }}.png" "$(odin root)"

      - name: Screenshot (best effort, the runner may have no GUI session)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: ./diskfull --screenshot "screenshot-${{ matrix.name }}.png" "$(odin root)"

      - name: Screenshot (best effort, software OpenGL from Mesa)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GALLIUM_DRIVER: llvmpipe
        run: |
          # Hosted runners have no GPU and Windows' own OpenGL is 1.1: use Mesa's.
          gh release download -R pal1000/mesa-dist-win --pattern "mesa3d-*-release-msvc.7z" --output mesa.7z
          7z x mesa.7z -omesa -y | Out-Null
          New-Item -ItemType Directory shot | Out-Null
          Copy-Item diskfull.exe, mesa\x64\*.dll shot\
          $root = (odin root).Trim().TrimEnd('\', '/')
          # diskfull.exe is a GUI program: wait for it explicitly.
          $p = Start-Process shot\diskfull.exe -ArgumentList '--screenshot', "screenshot-${{ matrix.name }}.png", "`"$root`"" -Wait -PassThru
          exit $p.ExitCode

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshot-${{ matrix.name }}
          path: screenshot-*.png
          if-no-files-found: warn

      - name: Package
        shell: bash
        run: |
          mkdir dist
          case "${{ runner.os }}" in
            Linux)   tar -czf "dist/diskfull-${{ matrix.name }}.tar.gz" diskfull README.md LICENSE ;;
            macOS)   ditto -c -k --keepParent DiskFull.app "dist/DiskFull-${{ matrix.name }}.zip" ;;
            Windows) 7z a "dist/diskfull-${{ matrix.name }}.zip" diskfull.exe README.md LICENSE ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # install.sh checks downloads against this.
          (cd dist && sha256sum -- * > SHA256SUMS)
          cat > notes.md <<'EOF'
          ## Install

          macOS and Linux:

          ```sh
          curl -fsSL https://raw.githubusercontent.com/hubastard/diskfull/main/install.sh | sh
          ```

          Windows (PowerShell):

          ```powershell
          irm https://raw.githubusercontent.com/hubastard/diskfull/main/install.ps1 | iex
          ```

          ## Downloads

          - **macOS** (Apple Silicon): `DiskFull-macos-arm64.zip`. The app is not notarized: if you download it with a browser, allow it the first time in System Settings › Privacy & Security › Open Anyway, or run `xattr -dr com.apple.quarantine DiskFull.app`.
          - **Windows** (x64): `diskfull-windows-x64.zip`
          - **Linux** (x64, arm64): `diskfull-linux-*.tar.gz`. Needs glibc 2.35+ and X11 (or XWayland).
          EOF
          # The GitHub API sometimes answers 500: retry, and complete a release
          # that an earlier attempt (or run) already created.
          for attempt in 1 2 3 4 5; do
            if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber && exit 0
            else
              gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
                --title "diskfull $GITHUB_REF_NAME" --notes-file notes.md --generate-notes && exit 0
            fi
            sleep $((attempt * 15))
          done
          exit 1

  # Run the one-line installers: on a tag against the release just published,
  # otherwise against the latest release, so changes to the scripts get tested.
  install:
    name: install (${{ matrix.os }})
    needs: [build, release]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.release.result != 'failure' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm, macos-latest, windows-latest]
    env:
      DISKFULL_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install
        if: runner.os != 'Windows'
        run: sh < install.sh # what curl ... | sh does

      - name: Check
        if: runner.os != 'Windows'
        run: |
          test -x "$HOME/.local/bin/diskfull"
          if [ "$RUNNER_OS" = macOS ]; then
            codesign --verify /Applications/DiskFull.app
          else
            if ldd "$HOME/.local/bin/diskfull" | grep 'not found'; then exit 1; fi
          fi

      # irm ... | iex, in the PowerShell that ships with Windows, then in PowerShell 7
      # (which also exercises reinstalling over an existing copy).
      - name: Install (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: Get-Content install.ps1 -Raw | Invoke-Expression

      - name: Reinstall (PowerShell 7)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Get-Content install.ps1 -Raw | Invoke-Expression

      - name: Check
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\diskfull'
          if (-not (Test-Path "$dir\diskfull.exe")) { throw 'diskfull.exe is not installed' }
          if (Test-Path "$dir\diskfull.exe.old") { throw 'the previous copy was left behind' }
          if (([Environment]::GetEnvironmentVariable('Path', 'User') -split ';') -notcontains $dir) { throw "$dir is not on the user PATH" }
          if (-not (Test-Path (Join-Path ([Environment]::GetFolderPath('Programs')) 'DiskFull.lnk'))) { throw 'no Start menu shortcut' }
          Get-ChildItem $dir
